<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <title>Último Capítulo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="FinalChapter_style.css"
  />

</head>

<body>

  <div class="container">

    <!-- =========================
         LOBBY
    ========================== -->

    <div id="lobbyScreen" class="screen active">

      <h1 class="wordmark">Último Capítulo</h1>
      <div class="subtitle">Quem matou o Roteirista?</div>

      <h2 class="sectionLabel">ESCOLHA SEU PERSONAGEM</h2>

      <div id="characterGrid" class="charGrid"></div>

      <p id="lobbyWaitingText" class="waitText">Esperando o anfitrião começar a gravação...</p>

      <button id="hostButton" class="btn btnMarker btnStart hostOnly" style="display:none" onclick="SendHostCommand()">Começar Jogo</button>

    </div>


    <!-- =========================
         TUTORIAL
    ========================== -->

    <div id="tutorialScreen" class="screen">

      <div class="sheet tutorialSheet">
        <h1>Como jogar</h1>
        <p>Acompanhem a explicação das regras na TV!</p>
      </div>

      <div id="tutorialControls">

        <div class="row">
          <button class="btn btnGhost btnTutorial" onclick="SendTutorialAction('prev')">← Anterior</button>
          <button class="btn btnMarker btnTutorial" onclick="SendTutorialAction('next')">Próxima →</button>
        </div>

        <button class="btn btnGhost btnSkip" onclick="SendTutorialAction('skip')">Pular Tutorial</button>

      </div>

    </div>


    <!-- =========================
         PLAYING
    ========================== -->

    <div id="playingScreen" class="screen">

      <!-- TOPO: aba na cor do meu personagem -->
      <header id="celTopo" class="celTopo">
        <div class="topoInfo">
          <div id="meName" class="meName"></div>
          <div id="meSub" class="meSub"></div>
        </div>
        <div id="meTimer" class="meTimer"></div>
      </header>

      <main class="tabArea">

        <section id="tab-cena" class="tabBody active">
          <!-- PAINEL DA FASE ATUAL (preenchido por RenderActionPanel) -->
          <div id="actionPanel" class="panel"></div>
          <div id="miniLog" class="miniLog"></div>
          <button id="skipButton" class="btn btnGhost btnSkipDecision hostOnly" style="display:none" onclick="SendHostCommand()">Pular decisão atual</button>
        </section>

        <section id="tab-notes" class="tabBody">
          <p class="notesHint">Toque: vazio → <b>✓</b> tem → <b>✗</b> não tem → <b>?</b> talvez</p>
          <div id="tagBar" class="tagBar"></div>
          <div id="notesGrid" class="notesSheet"></div>
        </section>

        <section id="tab-hand" class="tabBody"></section>

        <section id="tab-gossips" class="tabBody"></section>

        <section id="tab-map" class="tabBody">
          <div id="mapView"></div>
        </section>

      </main>

      <!-- ABAS DE FICHÁRIO -->
      <nav class="tabs" aria-label="Abas">
        <button class="tab active" data-tab="cena" style="flex:1 1 0" onclick="ShowTab('cena')">Cena</button>
        <button class="tab" data-tab="notes" style="flex:1.45 1 0" onclick="ShowTab('notes')">Bloquinho</button>
        <button class="tab" data-tab="hand" style="flex:1.05 1 0" onclick="ShowTab('hand')">Cartas</button>
        <button class="tab" data-tab="gossips" style="flex:1.2 1 0" onclick="ShowTab('gossips')">Fofocas<span id="gossipBadge" class="badge"></span></button>
        <button class="tab" data-tab="map" style="flex:1 1 0" onclick="ShowTab('map')">Mapa</button>
      </nav>

      <p id="rejectedText" class="toast" role="status"></p>

    </div>


    <!-- =========================
         FINAL
    ========================== -->

    <div id="finalScoreScreen" class="screen">

      <p class="finalKicker">A ÚLTIMA PÁGINA</p>
      <h1 id="finalWinner" class="finalTitle"></h1>

      <div class="tornSheet">
        <p id="finalLine" class="revealLine"></p>
        <div id="finalSolution" class="solution"></div>
      </div>

      <div class="finalButtons">
        <button id="againButton" class="btn btnMarker btnAgain hostOnly" style="display:none" onclick="SendHostCommand()">Jogar de Novo</button>
        <button class="btn btnGhost" onclick="window.location.href='../index.html'">Voltar ao Início</button>
      </div>

    </div>

  </div>

  <div id="pauseOverlay" class="pauseOverlay">
    <div class="pauseOverlayCard">
      <h2>Jogo Pausado</h2>
      <p>Aguarde o anfitrião retomar...</p>
    </div>
  </div>

  <script type="module" src="FinalChapter_app.js"></script>

</body>

</html>
