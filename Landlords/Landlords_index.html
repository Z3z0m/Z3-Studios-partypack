<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Landlord's</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="Landlords_style.css"
  />

</head>

<body>

  <div class="container">

    <!-- =========================
         LOBBY
    ========================== -->

    <div id="lobbyScreen" class="screen active">

      <h1 class="wordmark">LANDLORD'S</h1>
      <p class="subtitle">Edição Sudeste · ES → MG → RJ → SP</p>

      <p>Esperando o anfitrião começar a viagem...</p>

    </div>


    <!-- =========================
         TUTORIAL
    ========================== -->

    <div id="tutorialScreen" class="screen">

      <h2>COMO JOGAR</h2>

      <p>Acompanhem a explicação das regras na TV!</p>

      <div id="tutorialControls">

        <div class="row">
          <button class="btn" onclick="SendTutorialAction('prev')">← Anterior</button>
          <button class="btn" onclick="SendTutorialAction('next')">Próxima →</button>
        </div>

        <button class="btn btnGhost" onclick="SendTutorialAction('skip')">Pular Tutorial</button>

      </div>

    </div>


    <!-- =========================
         PLAYING
    ========================== -->

    <div id="playingScreen" class="screen">

      <!-- MEU STATUS -->
      <div class="meCard">
        <span id="meDot" class="dot"></span>
        <div class="meInfo">
          <div id="meName" class="meName"></div>
          <div id="mePlace" class="meSub"></div>
        </div>
        <div id="meCash" class="meCash">$0</div>
      </div>

      <div id="heldCards" class="heldCards"></div>

      <!-- PAINEL DA FASE ATUAL (preenchido por RenderActionPanel) -->
      <div id="actionPanel" class="panel"></div>

      <!-- ABAS -->
      <div class="tabs">
        <button class="tab active" data-tab="places" onclick="ShowTab('places')">Meus locais</button>
        <button class="tab" data-tab="trade" onclick="ShowTab('trade')">Negociar <span id="tradeBadge" class="badge"></span></button>
        <button class="tab" data-tab="players" onclick="ShowTab('players')">Placar</button>
      </div>

      <div id="tab-places" class="tabBody active"></div>

      <div id="tab-trade" class="tabBody">

        <div id="incomingTrades"></div>

        <div class="panel">
          <p class="label">Propor negociação com:</p>
          <select id="tradeTarget" onchange="RenderTradeBuilder()"></select>

          <div class="tradeCols">
            <div>
              <p class="label">Você oferece</p>
              <div id="tradeOfferList" class="checkList"></div>
              <input id="tradeOfferCash" type="number" min="0" step="1" inputmode="numeric" placeholder="$ dinheiro" />
            </div>
            <div>
              <p class="label">Você pede</p>
              <div id="tradeRequestList" class="checkList"></div>
              <input id="tradeRequestCash" type="number" min="0" step="1" inputmode="numeric" placeholder="$ dinheiro" />
            </div>
          </div>

          <button class="btn" onclick="SendTradeProposal()">Enviar proposta</button>
        </div>

        <div id="outgoingTrades"></div>

      </div>

      <div id="tab-players" class="tabBody"></div>

      <div id="miniLog" class="miniLog"></div>

      <p id="rejectedText" class="toast"></p>

    </div>


    <!-- =========================
         FINAL
    ========================== -->

    <div id="finalScoreScreen" class="screen">

      <p class="label">FIM DA VIAGEM</p>
      <h1 id="finalWinner" class="wordmark"></h1>
      <p id="finalReason" class="subtitle"></p>

      <div id="finalRanking"></div>

      <button class="btn btnGhost" onclick="window.location.href='../index.html'">Voltar ao Início</button>

    </div>

    <button id="hostButton" class="btn hostButton" style="display:none" onclick="SendHostCommand()">Começar Jogo</button>

  </div>

  <div id="pauseOverlay" class="pauseOverlay">
    <div class="pauseOverlayCard">
      <h2>Jogo Pausado</h2>
      <p>Aguarde o host retomar...</p>
    </div>
  </div>

  <script type="module" src="Landlords_app.js"></script>

</body>

</html>
