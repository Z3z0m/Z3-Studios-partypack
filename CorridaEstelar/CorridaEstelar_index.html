<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Corrida Estelar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="CorridaEstelar_style.css"
  />

</head>

<body>

  <div class="container">

    <!-- =========================
         LOBBY SCREEN
    ========================== -->

    <div
      id="lobbyScreen"
      class="screen active"
    >

      <h1>
        CORRIDA ESTELAR
      </h1>

      <p>
        Escolha sua equipe:
      </p>

      <div class="teamPickRow">

        <button
          id="teamSolarBtn"
          class="teamPickBtn teamPickSolar"
          onclick="SelectTeam('Solar')"
        >
          Equipe Solar
        </button>

        <button
          id="teamLunarBtn"
          class="teamPickBtn teamPickLunar"
          onclick="SelectTeam('Lunar')"
        >
          Equipe Lunar
        </button>

      </div>

      <button
        id="explorerToggleBtn"
        class="explorerToggleBtn"
        style="display:none"
        onclick="ToggleExplorer()"
      >
        Virar Explorador
      </button>

      <p class="sectionLabel">
        Jogadores
      </p>

      <div id="lobbyRoster" class="lobbyRoster">
      </div>

      <p
        id="startRejectedText"
        class="rejectedText"
      >
      </p>

    </div>


    <!-- =========================
         TUTORIAL SCREEN
    ========================== -->

    <div
      id="tutorialScreen"
      class="screen"
    >

      <h2>
        COMO JOGAR
      </h2>

      <p>
        Acompanhem a explicação das regras na tela principal!
      </p>

      <div id="tutorialControls">

        <div class="tutorialNavRow">

          <button onclick="SendTutorialAction('prev')">
            ← Anterior
          </button>

          <button onclick="SendTutorialAction('next')">
            Próxima →
          </button>

        </div>

        <button
          id="skipTutorialBtn"
          onclick="SendTutorialAction('skip')"
        >
          Pular Tutorial
        </button>

      </div>

    </div>


    <!-- =========================
         PLAYING SCREEN
    ========================== -->

    <div
      id="playingScreen"
      class="screen"
    >

      <div class="turnHeaderRow">

        <p
          id="turnBannerText"
          class="turnBanner"
        >
        </p>

        <div id="timerRing" class="timerRing">
          <div class="timerRingHole">
            <span id="turnCountdown">--</span>
          </div>
        </div>

      </div>

      <p id="clueDisplayText" class="clueDisplayText"></p>

      <div id="starGrid" class="starGrid">
      </div>

      <!-- FORM DO EXPLORADOR (só aparece na própria vez, fase GivingClue) -->
      <div id="clueForm" class="clueForm" style="display:none">

        <input
          id="clueWordInput"
          type="text"
          placeholder="Palavra da pista"
          maxlength="24"
          onkeydown="HandleEnterKey(event, SubmitClue)"
        />

        <input
          id="clueNumberInput"
          type="number"
          min="0"
          max="9"
          placeholder="Nº"
        />

        <button onclick="SubmitClue()">
          Enviar Pista
        </button>

      </div>

      <!-- CONTROLES DO OBSERVADOR (só aparece na própria vez, fase Guessing) -->
      <div id="guessControls" class="guessControls" style="display:none">

        <p id="guessesRemainingText"></p>

        <button onclick="PassTurn()">
          PASSAR A VEZ
        </button>

      </div>

      <p
        id="rejectedText"
        class="rejectedText"
      >
      </p>

    </div>


    <!-- =========================
         RESULT SCREEN
    ========================== -->

    <div
      id="resultScreen"
      class="screen"
    >

      <h2>
        FIM DA CORRIDA
      </h2>

      <p
        id="resultWinnerText"
        class="resultWinnerText"
      >
      </p>

      <div id="resultGrid" class="starGrid">
      </div>

      <p class="sectionLabel">
        Placar Geral
      </p>

      <div id="resultScoreboard">
      </div>

    </div>


    <!-- =========================
         FINAL SCORE SCREEN
    ========================== -->

    <div
      id="finalScoreScreen"
      class="screen"
    >

      <h2>
        RESULTADO FINAL
      </h2>

      <div id="finalScores">
      </div>

      <button
        class="homeButton"
        onclick="window.location.href='../index.html'"
      >
        Voltar ao Início
      </button>

    </div>

    <button
      id="hostButton"
      style="display:none"
      onclick="SendHostCommand()"
    >
      Começar Jogo
    </button>

  </div>


  <div
    id="pauseOverlay"
    class="pauseOverlay"
  >
    <div class="pauseOverlayCard">
      <h2>Jogo Pausado</h2>
      <p>Aguarde o host retomar...</p>
    </div>
  </div>

  <script
    type="module"
    src="CorridaEstelar_app.js"
  ></script>

</body>

</html>
