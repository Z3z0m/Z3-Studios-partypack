<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Sem Piedade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="SemPiedade_style.css"
  />

</head>

<body>

  <div class="container">

    <!-- =========================
         LOBBY
    ========================== -->

    <div id="lobbyScreen" class="screen active">

      <h1 class="wordmark">SEM PIEDADE</h1>
      <p class="subtitle">Conquista mundial com missão secreta</p>

      <p class="label" style="text-align:center;margin-top:18px">Escolha seu exército</p>
      <div id="colorGrid" class="colorGrid"></div>

      <div id="teamPicker"></div>

      <div id="lobbyConfig" class="panel"></div>

      <p id="lobbyWaitingText">Esperando o anfitrião começar...</p>

    </div>


    <!-- =========================
         TUTORIAL
    ========================== -->

    <div id="tutorialScreen" class="screen">

      <h2>COMO JOGAR</h2>

      <p>Acompanhem a explicação das regras na TV!</p>

      <div id="tutorialControls">

        <div class="row">
          <button class="btn" onclick="SendTutorialAction('prev')">← Anterior</button>
          <button class="btn" onclick="SendTutorialAction('next')">Próxima →</button>
        </div>

        <button class="btn btnGhost" onclick="SendTutorialAction('skip')">Pular Tutorial</button>

      </div>

    </div>


    <!-- =========================
         PLAYING
    ========================== -->

    <div id="playingScreen" class="screen">

      <!-- MEU STATUS -->
      <div class="meCard">
        <span id="meDot" class="dot"></span>
        <div class="meInfo">
          <div id="meName" class="meName"></div>
          <div id="meSub" class="meSub"></div>
        </div>
        <div id="meTimer" class="meTimer"></div>
      </div>

      <!-- MISSÃO (só neste celular; escondida até tocar) -->
      <button id="missionCard" class="missionCard" onclick="ToggleMission()"></button>

      <!-- PAINEL DA FASE ATUAL (preenchido por RenderActionPanel) -->
      <div id="actionPanel" class="panel"></div>

      <!-- MÃO DE CARTAS (só as suas) -->
      <div id="cardsPanel"></div>

      <!-- MAPA -->
      <div class="mapHeader">
        <p class="label">Mapa</p>
        <button id="zoomButton" class="zoomButton" style="visibility:hidden" onclick="ResetMapView()">Ver tudo</button>
      </div>
      <div id="mapView"></div>

      <!-- LISTA DE TERRITÓRIOS DA FASE (sempre abaixo do mapa; movida do actionPanel) -->
      <div id="choicePanel" class="panel"></div>

      <div id="miniLog" class="miniLog"></div>

      <p id="rejectedText" class="toast"></p>

    </div>


    <!-- =========================
         FINAL
    ========================== -->

    <div id="finalScoreScreen" class="screen">

      <p class="label">FIM DE JOGO</p>
      <h1 id="finalWinner" class="wordmark"></h1>
      <p id="finalReason" class="hint"></p>

      <p class="label" style="margin-top:14px">As missões de todo mundo</p>
      <div id="finalRanking" class="panel"></div>

      <button class="btn btnGhost" onclick="window.location.href='../index.html'">Voltar ao Início</button>

    </div>

    <button id="hostButton" class="btn hostButton" style="display:none" onclick="SendHostCommand()">Começar Jogo</button>

  </div>

  <div id="pauseOverlay" class="pauseOverlay">
    <div class="pauseOverlayCard">
      <h2>Jogo Pausado</h2>
      <p>Aguarde o host retomar...</p>
    </div>
  </div>

  <script type="module" src="SemPiedade_app.js"></script>

</body>

</html>
