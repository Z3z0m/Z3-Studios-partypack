<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#141414" />

  <title>Sem Piedade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="SemPiedade_style.css"
  />

</head>

<body>

  <div class="container">

    <!-- =========================
         LOBBY
    ========================== -->

    <div id="lobbyScreen" class="screen active">

      <!-- Cabeçalho grande (jogador) ou compacto (anfitrião): RenderLobby -->
      <div id="lobbyHead"></div>

      <div class="pad">
        <div id="colorSection"></div>
        <div id="lobbyConfig"></div>
        <div id="teamPicker"></div>
        <div id="lobbyRoster"></div>
      </div>

      <div id="lobbyWaiting" class="dock waitBar" role="status"></div>

    </div>


    <!-- =========================
         TUTORIAL
    ========================== -->

    <div id="tutorialScreen" class="screen inkScreen">

      <div class="band bandTutorial" aria-hidden="true"></div>

      <div class="tutorialInner">
        <p class="kicker">Como jogar</p>
        <h1 class="display">Olho<br>na TV!</h1>
        <p id="tutorialText" class="lead">As regras aparecem na tela grande.</p>
      </div>

      <div id="tutorialControls" class="dock tutorialDock">

        <div class="row">
          <button type="button" class="btn btnGhost" onclick="SendTutorialAction('prev')">← Anterior</button>
          <button type="button" class="btn btnPaper" onclick="SendTutorialAction('next')">Próxima →</button>
        </div>

        <button type="button" class="btnLink" onclick="SendTutorialAction('skip')">Pular tutorial</button>

      </div>

    </div>


    <!-- =========================
         PLAYING
    ========================== -->

    <div id="playingScreen" class="screen">

      <!-- MEU STATUS -->
      <header class="topBar">
        <span id="meDot" class="meSwatch" aria-hidden="true"></span>
        <div class="meInfo">
          <div id="meName" class="meName"></div>
          <div id="meSub" class="meSub"></div>
        </div>
        <div id="meTimer" class="meTimer" role="timer" aria-label="Segundos restantes"></div>
      </header>

      <!-- MISSÃO (só neste celular; escondida até tocar) -->
      <button id="missionCard" type="button" class="missionCard closed" aria-expanded="false" onclick="ToggleMission()"></button>

      <div id="playBody" class="playBody">

        <!-- PAINEL DA FASE ATUAL (preenchido por RenderActionPanel) -->
        <div id="actionPanel"></div>

        <!-- MÃO DE CARTAS (só as suas) -->
        <div id="cardsPanel"></div>

        <!-- MAPA -->
        <div id="mapWrap" class="mapWrap">
          <p class="label mapLabel">Mapa</p>
          <div id="mapView"></div>
          <button id="zoomButton" type="button" class="zoomButton" style="visibility:hidden" onclick="ResetMapView()">Ver tudo</button>
        </div>

        <!-- LISTA DA FASE e o que fica abaixo do mapa (movidos do actionPanel) -->
        <div id="choicePanel"></div>

        <div id="miniLog" class="miniLog" aria-live="polite"></div>

      </div>

      <p id="rejectedText" class="toast" role="status" aria-live="assertive"></p>

    </div>


    <!-- =========================
         FINAL
    ========================== -->

    <div id="finalScoreScreen" class="screen">

      <header class="finalHead">
        <div id="finalBand" class="band" aria-hidden="true"></div>
        <div class="finalHeadInner">
          <p class="kicker">Fim de jogo</p>
          <h1 id="finalWinner" class="display"></h1>
          <p id="finalReason" class="finalReason"></p>
        </div>
      </header>

      <div class="pad">
        <h2 class="sectionTitle">As missões de todo mundo</h2>
        <div id="finalRanking"></div>
      </div>

    </div>

  </div>

  <!-- BARRA FIXA: botões da fase (movidos do actionPanel) + botão do anfitrião -->
  <div id="actionBar" class="dock actionBar empty">
    <div id="barSlot" class="barSlot"></div>
    <button id="hostButton" type="button" class="btn btnPrimary hostButton" style="display:none" onclick="SendHostCommand()">Começar jogo</button>
    <a id="homeLink" class="btnLink" href="../index.html" style="display:none">Voltar ao início</a>
  </div>

  <div id="pauseOverlay" class="pauseOverlay" role="alertdialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div class="pauseCard">
      <div class="pauseIcon" aria-hidden="true"><span></span><span></span></div>
      <h2 id="pauseTitle">Jogo pausado</h2>
      <p>Aguarde o anfitrião retomar... o seu relógio também parou.</p>
    </div>
  </div>

  <script type="module" src="SemPiedade_app.js"></script>

</body>

</html>
